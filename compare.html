<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>去黑边效果对比</title>
<style>
  :root { --bg:#f4f4f2; --fg:#222; --muted:#777; --line:#d8d8d4; --card:#fff; --sel:#e6eefc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161616; --fg:#eee; --muted:#999; --line:#333; --card:#222; --sel:#29405e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  aside { width:200px; flex:none; border-right:1px solid var(--line); display:flex; flex-direction:column; }
  aside .head { padding:10px 12px; border-bottom:1px solid var(--line); color:var(--muted); flex:none; }
  aside .head b { color:var(--fg); }
  ul { margin:0; padding:4px 0; list-style:none; overflow:auto; flex:1; }
  li { padding:5px 12px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  li:hover { background:var(--line); }
  li.active { background:var(--sel); font-weight:600; }
  li.miss { color:var(--muted); }
  main { flex:1; min-width:0; display:flex; gap:12px; padding:12px; }
  figure { flex:1 1 0; min-width:0; margin:0; display:flex; flex-direction:column;
           background:var(--card); border:1px solid var(--line); border-radius:6px; padding:8px; }
  figure img { flex:1; min-height:0; width:100%; object-fit:contain; background:#fff; }
  figcaption { flex:none; padding-top:6px; text-align:center; color:var(--muted); font-size:12px; }
  #hint { margin:auto; max-width:32em; padding:16px; color:var(--muted); }
  #hint code { color:var(--fg); }
</style>
</head>
<body>
  <aside>
    <div class="head">共 <b id="count">0</b> 张 · ↑↓ 切换</div>
    <ul id="list"></ul>
  </aside>
  <main id="main">
    <figure><img id="imgTest" alt="" hidden><figcaption id="capTest"></figcaption></figure>
    <figure><img id="imgOut" alt="" hidden><figcaption id="capOut"></figcaption></figure>
  </main>
  <div id="hint"></div>
<script>
const TEST_DIR = "test/", OUT_DIR = "output/";
const listEl = document.getElementById("list");
const hint = document.getElementById("hint");
const imgs = { test: document.getElementById("imgTest"), output: document.getElementById("imgOut") };
const caps = { test: document.getElementById("capTest"), output: document.getElementById("capOut") };
const base = (n) => n.replace(/\.[^.]+$/, "");

async function listDir(dir) {
  const res = await fetch(dir);                       // 需要 HTTP 服务，见下方提示
  if (!res.ok) throw new Error(res.status + " " + dir);
  const doc = new DOMParser().parseFromString(await res.text(), "text/html");
  return [...doc.querySelectorAll("a[href]")]
    .map((a) => decodeURIComponent(a.getAttribute("href")))
    .filter((n) => n && !n.endsWith("/") && !n.startsWith("?"));
}

async function load() {
  const [tests, outs] = await Promise.all([listDir(TEST_DIR), listDir(OUT_DIR)]);
  const outByBase = new Map(outs.map((n) => [base(n), n]));   // 允许两侧后缀不同（jpg/jpeg）
  const items = tests
    .sort((a, b) => base(a).localeCompare(base(b), undefined, { numeric: true }))
    .map((n) => ({ name: n, out: outByBase.get(base(n)) || null }));

  document.getElementById("count").textContent = items.length;
  listEl.innerHTML = items.map((it, i) =>
    `<li class="${it.out ? "" : "miss"}" title="${it.name}">${it.name}</li>`).join("");
  [...listEl.children].forEach((li, i) => li.addEventListener("click", () => show(i)));

  let idx = 0;
  function show(i) {
    idx = (i + items.length) % items.length;
    const it = items[idx];
    imgs.test.hidden = false;
    imgs.test.src = encodeURI(TEST_DIR + it.name);
    caps.test.textContent = TEST_DIR + it.name;
    imgs.output.hidden = !it.out;
    caps.output.textContent = it.out ? OUT_DIR + it.out : "缺少 output 对应文件";
    if (it.out) imgs.output.src = encodeURI(OUT_DIR + it.out);
    [...listEl.children].forEach((li, j) => li.classList.toggle("active", j === idx));
    listEl.children[idx].scrollIntoView({ block: "nearest" });
  }

  hint.remove();
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { show(idx + 1); e.preventDefault(); }
    if (e.key === "ArrowUp") { show(idx - 1); e.preventDefault(); }
  });
  show(0);
}

load().catch((err) => {
  hint.innerHTML = location.protocol === "file:"
    ? "无法列出目录：浏览器不允许 file:// 读取目录。请在本目录下启动静态服务：<br>" +
      "<code>python3 -m http.server 8000</code><br>然后打开 <code>http://localhost:8000/compare.html</code>"
    : "读取 test/ 或 output/ 失败：" + err;
});
</script>
</body>
</html>
